# Sveltia CMS 설정 — 관리자 페이지(/admin)가 편집하는 파일과 필드.
# 저장 = main 브랜치에 커밋 → .github/workflows/pages.yml 이 1~2분 뒤 사이트를 다시 배포한다. DB·서버 없음.
# 로그인: GitHub 개인 액세스 토큰(Contents 읽기/쓰기 권한, 이 레포만) 으로 "Sign In Using Access Token".
backend:
  name: github
  repo: sungkuk5420/dragontkdphuket
  branch: main
  commit_messages:
    update: "content: {{collection}} {{slug}} 수정 (관리자 페이지)"
    uploadMedia: "content: 이미지 업로드 {{path}} (관리자 페이지)"
    deleteMedia: "content: 이미지 삭제 {{path}} (관리자 페이지)"

site_url: https://dragongymphuket.com/
display_url: https://dragongymphuket.com/
logo_url: /assets/logo.png

# 이미지 저장소 = 레포 자체. 업로드하면 webp 로 바꾸고 긴 변 1600px 로 줄여 레포가 불어나지 않게 한다.
media_folder: site/assets/uploads
public_folder: assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 10000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

# 3개 언어 문자열 묶음은 첫 사용처(지점 이름)에서 &tri 로 정의하고 이후 *tri 로 재사용한다
collections:
  - name: content
    label: 사이트 콘텐츠
    editor: { preview: false }
    files:
      # ---------------- 지점·시간표 ----------------
      - name: branches
        label: 지점 · 시간표
        file: site/content/branches.json
        format: json
        fields:
          - name: branches
            label: 지점
            label_singular: 지점
            widget: list
            summary: "{{fields.name.ko}} ({{fields.id}})"
            hint: 첫 번째 지점이 시간표·지점 탭의 기본 선택입니다. 드래그로 순서를 바꿀 수 있습니다.
            fields:
              - { name: id, label: 지점 ID, widget: string, hint: "영문 소문자. 이미 있는 지점의 ID 는 바꾸지 마세요 (링크·지도에 쓰입니다)", pattern: ["^[a-z0-9-]+$", "영문 소문자·숫자·하이픈만"] }
              - { name: main, label: 본관(메인 지점), widget: boolean, default: false, required: false }
              - name: name
                label: 지점 이름
                widget: object
                fields: &tri
                  - { name: th, label: 태국어, widget: string }
                  - { name: en, label: 영어, widget: string }
                  - { name: ko, label: 한국어, widget: string }
              - { name: area, label: 지역, widget: object, fields: *tri }
              - { name: address, label: 주소, widget: object, fields: *tri }
              - { name: lat, label: 위도, widget: number, value_type: float, hint: "구글맵에서 장소 우클릭 → 첫 번째 숫자" }
              - { name: lng, label: 경도, widget: number, value_type: float, hint: "구글맵에서 장소 우클릭 → 두 번째 숫자" }
              - { name: placeId, label: 구글 place_id, widget: string, required: false, hint: 없으면 비워 두세요 }
              - { name: mapsQuery, label: 구글맵 검색어, widget: string, required: false, hint: place_id 가 없을 때 지도 열기에 쓰는 검색어 }
              - { name: mapsUrl, label: 구글맵 링크, widget: string, required: false, hint: 있으면 '구글맵에서 열기' 가 이 링크로 열립니다 }
              - name: phones
                label: 전화번호
                label_singular: 전화번호
                widget: list
                summary: "{{fields.number}} {{fields.label.ko}}"
                hint: 첫 번째 번호가 지점 카드의 전화 버튼이 됩니다
                fields:
                  - { name: number, label: 번호, widget: string, hint: "숫자만, 예: 0869515115", pattern: ["^[0-9]{9,10}$", "숫자 9~10자리"] }
                  - { name: label, label: 이름, widget: object, fields: *tri }
              - name: rating
                label: 구글 평점
                widget: object
                required: false
                hint: 구글맵 리뷰가 없는 지점은 비워 두세요
                fields:
                  - { name: score, label: 평점, widget: number, value_type: float, min: 0, max: 5, required: false }
                  - { name: count, label: 리뷰 수, widget: number, value_type: int, min: 0, required: false }
              - { name: poster, label: 시간표 포스터, widget: image, hint: 세로 포스터 이미지. 시간표 옆에 표시되고 누르면 확대됩니다 }
              - name: schedule
                label: 시간표
                label_singular: 수업
                widget: list
                summary: "{{fields.d}} {{fields.s}}–{{fields.e}} {{fields.p}} {{fields.note}}"
                fields:
                  - name: d
                    label: 요일
                    widget: select
                    options:
                      - { label: 월, value: mon }
                      - { label: 화, value: tue }
                      - { label: 수, value: wed }
                      - { label: 목, value: thu }
                      - { label: 금, value: fri }
                      - { label: 토, value: sat }
                      - { label: 일, value: sun }
                  - { name: s, label: 시작, widget: string, hint: "24시간제 HH:MM, 예: 16:20", pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "HH:MM 형식"] }
                  - { name: e, label: 종료, widget: string, hint: "24시간제 HH:MM, 예: 17:20", pattern: ["^([01][0-9]|2[0-3]):[0-5][0-9]$", "HH:MM 형식"] }
                  - name: p
                    label: 프로그램
                    widget: select
                    options:
                      - { label: "키즈 스포츠 (Kids Sport)", value: kids }
                      - { label: "기본반 (Basic)", value: basic }
                      - { label: "아크로바틱 (Acrobatics)", value: acro }
                      - { label: "선수반 (Athlete)", value: athlete }
                  - { name: note, label: 메모, widget: string, required: false, hint: "예: 3–5 y, Lv 1–2 (모든 언어에 그대로 표시)" }

      # ---------------- 코치진·선수 ----------------
      - name: team
        label: 코치진 · 선수
        file: site/content/team.json
        format: json
        fields:
          - name: judges
            label: 승단 심사위원진
            label_singular: 심사위원
            widget: list
            summary: "{{fields.name.ko}}"
            fields:
              - { name: img, label: 사진, widget: image, hint: 정사각형 사진 권장 }
              - { name: name, label: 이름, widget: object, fields: *tri }
              - { name: role, label: 직함, widget: object, fields: *tri }
              - { name: note, label: 한 줄 소개, widget: object, fields: *tri }
          - name: staff
            label: 코치진
            label_singular: 코치
            widget: list
            summary: "{{fields.name.ko}}"
            fields:
              - { name: img, label: 사진, widget: image, hint: 정사각형 사진 권장 }
              - { name: tag, label: 배지 문구, widget: string, required: false, hint: "사진 위 작은 배지, 예: 7th DAN" }
              - { name: name, label: 이름, widget: object, fields: *tri }
              - { name: role, label: 직함, widget: object, fields: *tri }
              - name: items
                label: 경력
                label_singular: 경력
                widget: list
                summary: "{{fields.ko}}"
                fields: *tri
          - name: coach
            label: 수석 코치 경력 타임라인
            widget: object
            fields:
              - name: timeline
                label: 연도별 경력
                label_singular: 경력
                widget: list
                summary: "{{fields.y}} {{fields.ko}}"
                fields:
                  - { name: y, label: 연도, widget: string, hint: "예: 2019, 2011–" }
                  - { name: th, label: 태국어, widget: string }
                  - { name: en, label: 영어, widget: string }
                  - { name: ko, label: 한국어, widget: string }
                  - { name: now, label: 현재 진행 중, widget: boolean, default: false, required: false }
          - name: athletes
            label: 드래곤짐 출신 국가대표
            label_singular: 선수
            widget: list
            summary: "{{fields.name.ko}}"
            fields:
              - { name: img, label: 사진, widget: image, hint: 정사각형 사진 권장 }
              - { name: name, label: 이름, widget: object, fields: *tri }
              - { name: gold, label: 금메달 강조 테두리, widget: boolean, default: false, required: false }
              - name: items
                label: 경력
                widget: object
                fields:
                  - { name: th, label: 태국어, widget: list, field: { name: item, label: 항목, widget: string } }
                  - { name: en, label: 영어, widget: list, field: { name: item, label: 항목, widget: string } }
                  - { name: ko, label: 한국어, widget: list, field: { name: item, label: 항목, widget: string } }

      # ---------------- 채팅 문의 (LINE·WhatsApp·Messenger) ----------------
      - name: contact
        label: LINE · WhatsApp · Messenger
        file: site/content/contact.json
        format: json
        fields:
          - name: line
            label: LINE
            widget: object
            fields:
              - { name: url, label: LINE 친구추가 링크, widget: string, pattern: ["^https://", "https:// 로 시작하는 주소"], hint: "LINE 앱 → 친구 추가 → QR 코드 → 링크 복사 (예: https://line.me/ti/p/...)" }
              - { name: qr, label: LINE QR 코드 이미지, widget: image, hint: 위 링크와 같은 계정의 QR 이어야 합니다. 정사각형 이미지 }
          - name: whatsapp
            label: WhatsApp
            widget: object
            fields:
              - { name: url, label: WhatsApp 링크, widget: string, pattern: ["^https://", "https:// 로 시작하는 주소"], hint: "예: https://wa.me/66869515115 (국가번호 66 + 0 뺀 번호)" }
              - { name: qr, label: WhatsApp QR 코드 이미지, widget: image, hint: 위 링크와 같은 계정의 QR 이어야 합니다. 정사각형 이미지 }
          - name: messenger
            label: Facebook Messenger
            widget: object
            fields:
              - { name: url, label: Messenger 링크, widget: string, pattern: ["^https://", "https:// 로 시작하는 주소"], hint: "예: https://m.me/페이지아이디" }

      # ---------------- SNS ----------------
      - name: social
        label: 인스타그램 · 페이스북 릴스
        file: site/content/social.json
        format: json
        fields:
          - name: instagram
            label: 인스타그램 게시물 코드
            label_singular: 게시물 코드
            hint: "instagram.com/p/<코드>/ 의 <코드> 부분. 최신이 위, 앞 3개만 표시"
            widget: list
            field: { name: code, label: 코드, widget: string }
          - name: reels
            label: 페이스북 릴스 ID
            label_singular: 릴스 ID
            hint: "facebook.com/reel/<ID>/ 의 숫자. 페이스북 자동 수집이 실패했을 때만 쓰이는 예비 목록"
            widget: list
            field: { name: id, label: ID, widget: string }
