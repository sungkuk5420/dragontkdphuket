<!doctype html>
<!-- Dragon Gym 관리자 페이지 (자체 화면, 빌드 없음).
     데이터: site/content/*.json + 이미지 site/assets/uploads/ — GitHub API 로 레포에 직접 커밋, DB·서버 없음.
     로그인: 비밀번호로 암호화된 GitHub 토큰(auth.json) 을 풀어 쓴다 (auth.js). 화면 로직은 app.js. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Dragon Gym 관리자</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
  <!-- ================= 로그인 ================= -->
  <main class="gate" id="gate" hidden>
    <div class="gate__card">
      <img class="gate__logo" src="../assets/logo.png" alt="">
      <h1 id="gateTitle">관리자 로그인</h1>
      <p class="lead" id="gateLead"></p>

      <form id="formUnlock" hidden>
        <label class="field"><span>비밀번호</span><input class="input" id="pw" type="password" autocomplete="current-password" required></label>
        <label class="check"><input id="remember" type="checkbox"> 이 기기에서 로그인 유지</label>
        <button class="btn btn--ink btn--block" type="submit">로그인</button>
        <nav><a href="#change">비밀번호 변경</a><a href="#reset">비밀번호를 잊었어요</a></nav>
      </form>

      <form id="formSetup" hidden>
        <label class="field"><span>GitHub 토큰</span><input class="input" id="tok" type="password" autocomplete="off" required placeholder="github_pat_…"></label>
        <p class="hint" style="margin-top:-8px;margin-bottom:14px">Fine-grained token · 이 레포만 · Contents: Read and write</p>
        <label class="field"><span>새 비밀번호 (10자 이상)</span><input class="input" id="npw1" type="password" autocomplete="new-password" minlength="10" required></label>
        <label class="field"><span>새 비밀번호 확인</span><input class="input" id="npw2" type="password" autocomplete="new-password" minlength="10" required></label>
        <button class="btn btn--ink btn--block" type="submit">저장하고 로그인</button>
        <nav id="setupNav"><a href="#">← 로그인으로</a></nav>
      </form>

      <form id="formChange" hidden>
        <label class="field"><span>현재 비밀번호</span><input class="input" id="opw" type="password" autocomplete="current-password" required></label>
        <label class="field"><span>새 비밀번호 (10자 이상)</span><input class="input" id="cpw1" type="password" autocomplete="new-password" minlength="10" required></label>
        <label class="field"><span>새 비밀번호 확인</span><input class="input" id="cpw2" type="password" autocomplete="new-password" minlength="10" required></label>
        <button class="btn btn--ink btn--block" type="submit">비밀번호 변경</button>
        <nav><a href="#">← 로그인으로</a></nav>
      </form>

      <p class="msg" id="gateMsg" role="status"></p>
    </div>
  </main>

  <!-- ================= 관리 화면 ================= -->
  <div id="shell" hidden>
    <header class="topbar">
      <button class="iconbtn back" id="backBtn" type="button" aria-label="목록으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <a class="brand" href="#"><img src="../assets/logo.png" alt=""><span>DRAGON GYM <small>관리</small></span></a>
      <div class="topbar__spacer"></div>
      <a class="btn btn--ghost btn--sm" href="../" target="_blank" rel="noopener">사이트<span class="hide-m">에서 확인</span></a>
      <button class="btn btn--ghost btn--sm" id="logoutBtn" type="button">로그아웃</button>
    </header>
    <div class="app" id="app">
      <aside class="side" id="side"></aside>
      <main class="main" id="main"><div class="loading">불러오는 중…</div></main>
    </div>
    <div class="savebar" id="savebar" role="region" aria-label="저장">
      <span id="saveText">저장하지 않은 변경사항이 있습니다</span>
      <button class="btn btn--ghost btn--sm" id="discardBtn" type="button">되돌리기</button>
      <button class="btn btn--gold btn--sm" id="saveBtn" type="button">저장</button>
    </div>
  </div>

  <dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog" novalidate></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js?v=1"></script>
</body>
</html>
